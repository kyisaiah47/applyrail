<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Example Co - Senior Full-Stack Engineer</title>
<!-- Synthetic fixture. It models the structure of a Lever apply page: one form whose questions
     are li.application-question rows, each a label holding div.application-label (with a
     span.required marker) and div.application-field; custom questions as cards[...] radios and
     selects; EEO selects named eeo[...]; an invisible hCaptcha. No employer data. -->
<style>
  body { font: 15px/1.5 sans-serif; margin: 40px; }
  ul { list-style: none; padding: 0; }
  .application-question { margin: 14px 0; }
  .required { color: #c00; }
</style>
</head>
<body>
<div class="content">
  <h2>Senior Full-Stack Engineer</h2>
  <form id="application-form" enctype="multipart/form-data" method="POST" onsubmit="return false">
    <div class="section page-centered application-form">
      <h4>Submit your application</h4>
      <ul>
        <li class="application-question resume">
          <label>
            <div class="application-label">Resume/CV<span class="required">&#10033;</span></div>
            <div class="application-field">
              <span class="filename"></span>
              <input class="application-file-input" id="resume-upload-input" name="resume" type="file">
            </div>
          </label>
        </li>
        <li class="application-question">
          <label>
            <div class="application-label">Full name<span class="required">&#10033;</span></div>
            <div class="application-field"><input type="text" name="name" data-qa="name-input"></div>
          </label>
        </li>
        <li class="application-question">
          <label>
            <div class="application-label">Email<span class="required">&#10033;</span></div>
            <div class="application-field"><input type="email" name="email" data-qa="email-input"></div>
          </label>
        </li>
        <li class="application-question">
          <label>
            <div class="application-label">Phone<span class="required">&#10033;</span></div>
            <div class="application-field"><input type="text" name="phone" data-qa="phone-input"></div>
          </label>
        </li>
        <li class="application-question">
          <label>
            <div class="application-label">Current location<span class="required">&#10033;</span></div>
            <div class="application-field"><input type="text" name="location" id="location-input" class="location-input"></div>
          </label>
        </li>
        <li class="application-question">
          <label>
            <div class="application-label">Current company</div>
            <div class="application-field"><input type="text" name="org" data-qa="org-input"></div>
          </label>
        </li>
      </ul>
    </div>
    <div class="section page-centered application-form">
      <h4>Links</h4>
      <ul>
        <li class="application-question">
          <label><div class="application-label">LinkedIn URL</div><div class="application-field"><input type="text" name="urls[LinkedIn]"></div></label>
        </li>
        <li class="application-question">
          <label><div class="application-label">GitHub URL</div><div class="application-field"><input type="text" name="urls[GitHub]"></div></label>
        </li>
        <li class="application-question">
          <label><div class="application-label">Portfolio URL</div><div class="application-field"><input type="text" name="urls[Portfolio]"></div></label>
        </li>
      </ul>
    </div>
    <div class="section page-centered application-form">
      <h4>Questions</h4>
      <ul>
        <li class="application-question custom-question">
          <div class="application-label full-width">Are you authorized to work in the United States?<span class="required">&#10033;</span></div>
          <div class="application-field">
            <ul data-qa="multiple-choice">
              <li><label><input type="radio" name="cards[c1][field0]" value="Yes"><span class="application-answer-alternative">Yes</span></label></li>
              <li><label><input type="radio" name="cards[c1][field0]" value="No"><span class="application-answer-alternative">No</span></label></li>
            </ul>
          </div>
        </li>
        <li class="application-question custom-question">
          <label>
            <div class="application-label">How many years of professional software engineering experience do you have?<span class="required">&#10033;</span></div>
            <div class="application-field">
              <select name="cards[c1][field1]">
                <option value="">Select...</option>
                <option value="0-2 years">0-2 years</option>
                <option value="3-5 years">3-5 years</option>
                <option value="6-9 years">6-9 years</option>
                <option value="10+ years">10+ years</option>
              </select>
            </div>
          </label>
        </li>
        <li class="application-question">
          <label>
            <div class="application-label">Additional information</div>
            <div class="application-field"><textarea name="comments" placeholder="Add a cover letter or anything else you want to share."></textarea></div>
          </label>
        </li>
      </ul>
    </div>
    <div class="section page-centered application-form">
      <h4>U.S. Equal Employment Opportunity information</h4>
      <ul>
        <li class="application-question">
          <label><div class="application-label">Gender</div>
            <div class="application-field"><select name="eeo[gender]"><option value="">Select ...</option><option value="Male">Male</option><option value="Female">Female</option><option value="Decline to self-identify">Decline to self-identify</option></select></div>
          </label>
        </li>
        <li class="application-question">
          <label><div class="application-label">Race</div>
            <div class="application-field"><select name="eeo[race]"><option value="">Select ...</option><option value="Asian">Asian</option><option value="Black or African American">Black or African American</option><option value="Hispanic or Latino">Hispanic or Latino</option><option value="White">White</option><option value="Two or More Races">Two or More Races</option><option value="Decline to self-identify">Decline to self-identify</option></select></div>
          </label>
        </li>
        <li class="application-question">
          <label><div class="application-label">Veteran status</div>
            <div class="application-field"><select name="eeo[veteran]"><option value="">Select ...</option><option value="I am a veteran">I am a veteran</option><option value="I am not a veteran">I am not a veteran</option><option value="Decline to self-identify">Decline to self-identify</option></select></div>
          </label>
        </li>
      </ul>
    </div>
    <div class="h-captcha" data-size="invisible" data-sitekey="00000000-0000-0000-0000-000000000000"></div>
    <button type="submit" id="btn-submit" class="template-btn-submit">Submit application</button>
  </form>
</div>
<script>
  // Lever shows the chosen resume's file name next to the input.
  var f = document.getElementById('resume-upload-input');
  f.addEventListener('change', function () {
    var name = f.files && f.files[0] ? f.files[0].name : '';
    f.parentNode.querySelector('.filename').textContent = name;
  });
</script>
</body>
</html>
