<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Senior Full-Stack Engineer at Example Co</title>
<!-- Synthetic fixture. It models the structure of a Greenhouse job board application form:
     label[for] plus input pairs inside .field-wrapper, a required marker in span.required,
     comboboxes with a listbox and a hidden required input beside each one, a location
     typeahead, resume and cover letter file inputs, and the EEO selects. No employer data. -->
<style>
  body { font: 15px/1.5 sans-serif; margin: 40px; }
  .field-wrapper { margin: 14px 0; }
  .select__menu { border: 1px solid #ccc; }
  .requiredInput { opacity: 0; height: 1px; width: 100%; }
</style>
</head>
<body>
<main>
  <h1>Senior Full-Stack Engineer</h1>
  <p>Example Co, Remote, United States</p>
  <form id="application-form" action="#" onsubmit="return false">
    <div class="field-wrapper">
      <label id="first_name-label" for="first_name">First Name<span class="required">*</span></label>
      <input id="first_name" class="input input__single-line" type="text" aria-required="true" autocomplete="off">
    </div>
    <div class="field-wrapper">
      <label id="last_name-label" for="last_name">Last Name<span class="required">*</span></label>
      <input id="last_name" class="input input__single-line" type="text" aria-required="true">
    </div>
    <div class="field-wrapper">
      <label id="email-label" for="email">Email<span class="required">*</span></label>
      <input id="email" class="input input__single-line" type="email" aria-required="true">
    </div>
    <div class="field-wrapper">
      <label id="phone-label" for="phone">Phone<span class="required">*</span></label>
      <input id="phone" class="input input__single-line" type="tel" aria-required="true">
    </div>
    <div class="field-wrapper">
      <label id="candidate-location-label" for="candidate-location">Location (City)<span class="required">*</span></label>
      <div class="select__container">
        <div class="select__value-container"><div class="select__single-value" data-value-display></div>
          <input id="candidate-location" role="combobox" aria-expanded="false" aria-required="true" aria-labelledby="candidate-location-label" aria-controls="candidate-location-listbox" type="text" value="">
        </div>
        <div class="select__menu" id="candidate-location-listbox" role="listbox" hidden data-options='["Denver City, Texas, United States", "Denver, Colorado, United States", "Denver, Iowa, United States"]'></div>
        <input required tabindex="-1" aria-hidden="true" class="requiredInput" name="candidate_location" value="">
      </div>
    </div>
    <div class="field-wrapper">
      <label id="resume-label" for="resume">Resume/CV<span class="required">*</span></label>
      <input id="resume" type="file" accept=".pdf,.doc,.docx,.txt" aria-required="true">
    </div>
    <div class="field-wrapper">
      <label id="cover_letter-label" for="cover_letter">Cover Letter</label>
      <input id="cover_letter" type="file" accept=".pdf,.doc,.docx,.txt">
    </div>
    <div class="field-wrapper">
      <label id="question_1001-label" for="question_1001">LinkedIn Profile</label>
      <input id="question_1001" class="input input__single-line" type="text">
    </div>
    <div class="field-wrapper">
      <label id="question_1002-label" for="question_1002">Website</label>
      <input id="question_1002" class="input input__single-line" type="text">
    </div>
    <div class="field-wrapper">
      <label id="question_1003-label" for="question_1003">Are you legally authorized to work in the United States?<span class="required">*</span></label>
      <div class="select__container">
        <div class="select__value-container"><div class="select__single-value" data-value-display></div>
          <input id="question_1003" role="combobox" aria-expanded="false" aria-required="true" aria-labelledby="question_1003-label" aria-controls="question_1003-listbox" type="text" value="">
        </div>
        <div class="select__menu" id="question_1003-listbox" role="listbox" hidden data-options='["Yes", "No"]'></div>
        <input required tabindex="-1" aria-hidden="true" class="requiredInput" name="question_1003" value="">
      </div>
    </div>
    <div class="field-wrapper">
      <label id="question_1004-label" for="question_1004">Will you now or in the future require sponsorship for employment visa status (e.g., H-1B visa status)?<span class="required">*</span></label>
      <div class="select__container">
        <div class="select__value-container"><div class="select__single-value" data-value-display></div>
          <input id="question_1004" role="combobox" aria-expanded="false" aria-required="true" aria-labelledby="question_1004-label" aria-controls="question_1004-listbox" type="text" value="">
        </div>
        <div class="select__menu" id="question_1004-listbox" role="listbox" hidden data-options='["Yes", "No"]'></div>
        <input required tabindex="-1" aria-hidden="true" class="requiredInput" name="question_1004" value="">
      </div>
    </div>
    <div class="field-wrapper">
      <label id="question_1005-label" for="question_1005">How did you hear about this job?</label>
      <input id="question_1005" class="input input__single-line" type="text">
    </div>
    <div class="field-wrapper">
      <label id="question_1006-label" for="question_1006">Is there anything else you would like us to know?</label>
      <textarea id="question_1006" rows="4"></textarea>
    </div>

    <section aria-labelledby="eeoc-title">
      <h2 id="eeoc-title">Voluntary Self-Identification</h2>
      <div class="field-wrapper">
        <label for="gender">Gender</label>
        <select id="gender"><option value="">Select...</option><option value="1">Male</option><option value="2">Female</option><option value="3">Decline To Self Identify</option></select>
      </div>
      <div class="field-wrapper">
        <label for="hispanic_ethnicity">Are you Hispanic/Latino?</label>
        <select id="hispanic_ethnicity"><option value="">Select...</option><option value="Yes">Yes</option><option value="No">No</option><option value="Decline">Decline To Self Identify</option></select>
      </div>
      <div class="field-wrapper">
        <label for="veteran_status">Veteran Status</label>
        <select id="veteran_status"><option value="">Select...</option><option value="1">I am not a protected veteran</option><option value="2">I identify as one or more of the classifications of a protected veteran</option><option value="3">I don't wish to answer</option></select>
      </div>
      <div class="field-wrapper">
        <label for="disability_status">Disability Status</label>
        <select id="disability_status"><option value="">Select...</option><option value="1">Yes, I have a disability, or have had one in the past</option><option value="2">No, I do not have a disability and have not had one in the past</option><option value="3">I do not want to answer</option></select>
      </div>
    </section>

    <div class="grecaptcha-badge" data-style="bottomright" aria-hidden="true"></div>
    <button type="submit" class="btn btn--pill">Submit application</button>
  </form>
</main>
<script>
  // A small stand-in for the combobox widget: it opens on focus, filters as you type, and commits
  // a clicked option into the visible value and the hidden required input.
  document.querySelectorAll('[role="combobox"]').forEach(function (input) {
    var lb = document.getElementById(input.getAttribute('aria-controls'));
    var all = JSON.parse(lb.getAttribute('data-options'));
    var box = input.closest('.select__container');
    var shown = box.querySelector('[data-value-display]');
    var store = box.querySelector('.requiredInput');
    function render() {
      var q = input.value.trim().toLowerCase();
      lb.innerHTML = '';
      all.filter(function (o) { return !q || o.toLowerCase().indexOf(q) >= 0; }).forEach(function (o, i) {
        var d = document.createElement('div');
        d.setAttribute('role', 'option');
        d.id = lb.id + '-' + i;
        d.textContent = o;
        d.addEventListener('click', function () {
          shown.textContent = o; store.value = o; input.value = '';
          lb.hidden = true; input.setAttribute('aria-expanded', 'false');
        });
        lb.appendChild(d);
      });
    }
    function open() { render(); lb.hidden = false; input.setAttribute('aria-expanded', 'true'); }
    input.addEventListener('focus', open);
    input.addEventListener('mousedown', open);
    input.addEventListener('click', open);
    input.addEventListener('input', open);
    input.addEventListener('keydown', function (e) { if (e.key === 'Escape') { lb.hidden = true; input.setAttribute('aria-expanded', 'false'); } });
  });
</script>
</body>
</html>
